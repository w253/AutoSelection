version: v4

# Operator catalog used by ActionLLM prompts.
# Keep this file aligned with search/operator_policy.py. Operators that are
# registered but not part of the active MCTS search space are intentionally
# omitted so the proposer sees only executable search actions.

families:
  dataset_size_control:
    operators:
      truncate_samples:
        description: "Hard-cap the dataset to a fixed total sample count."
        params:
          total_samples:
            type: int
            default: 10000
            range: [500, 100000]
            description: "Maximum number of samples retained before later filters."

  task_relevance_selection:
    operators:
      mona_filter:
        description: >
          SAE activation similarity filter. Keeps samples whose sparse SAE
          features are most similar to target-task activation centroids.
        params:
          fraction:
            type: float
            default: 0.5
            range: [0.01, 1.0]
            description: "Fraction of data to keep when top_k and threshold are unset."
          top_k:
            type: int
            default: null
            range: [100, 100000]
            description: "Absolute number of samples to keep; overrides fraction."
          threshold:
            type: float
            default: null
            range: [0.0, 1.0]
            description: "Minimum MONA score to keep; overrides fraction/top_k."
          descending:
            type: bool
            default: true
          keep_missing_scores:
            type: bool
            default: false

  precomputed_feature_filters:
    operators:
      ifd_filter:
        description: "Keep samples by precomputed Instruction-Following Difficulty score."
        params:
          fraction:
            type: float
            default: 0.5
            range: [0.05, 1.0]
          descending:
            type: bool
            default: true

      ngram_entropy:
        description: "Keep lexically diverse samples by precomputed n-gram entropy."
        params:
          fraction:
            type: float
            default: 0.5
            range: [0.05, 1.0]

      action_object_branching:
        description: "Keep structurally complex samples by precomputed action-object branching score."
        params:
          fraction:
            type: float
            default: 0.5
            range: [0.05, 1.0]

      varentropy_filter:
        description: "Keep samples with high token-level varentropy, a proxy for reasoning complexity."
        params:
          fraction:
            type: float
            default: 0.5
            range: [0.05, 1.0]
          top_k:
            type: int
            default: null
            range: [100, 100000]
          threshold:
            type: float
            default: null
            range: [0.0, 1.0]
          descending:
            type: bool
            default: true
          keep_missing_scores:
            type: bool
            default: false

  deduplication:
    operators:
      semantic_dedup:
        description: "Remove duplicate or near-duplicate samples with exact, MinHash, or embedding cosine matching."
        params:
          strategy:
            type: str
            default: "minhash"
            choices: ["exact", "minhash", "embedding_cosine"]
          jaccard_threshold:
            type: float
            default: 0.8
            range: [0.5, 0.99]
            description: "MinHash Jaccard threshold; lower is more aggressive."
          ngram_size:
            type: int
            default: 5
            range: [3, 10]
          num_perm:
            type: int
            default: 128
            range: [32, 256]
          threshold:
            type: float
            default: 0.98
            range: [0.8, 1.0]
            description: "Cosine similarity threshold for embedding_cosine strategy."
          embedding_path:
            type: str
            default: "metadata.extra.embedding"
          keep_missing_embeddings:
            type: bool
            default: true

      semdedup:
        description: >
          SAE sparse-feature semantic deduplication. Clusters samples, then
          removes highly similar items inside each cluster.
        params:
          num_clusters:
            type: int
            default: 1000
            range: [100, 10000]
          cosine_threshold:
            type: float
            default: 0.95
            range: [0.7, 0.99]
          embedding_path:
            type: str
            default: "metadata.extra.embedding"
          keep_missing_embeddings:
            type: bool
            default: true
          seed:
            type: int
            default: 42

  set_operations:
    operators:
      union:
        description: >
          Merge the current recipe output with a previously evaluated recipe by
          sample_id. Useful when a strong branch filtered too aggressively.
        params:
          source_recipe:
            type: str
            default: null
            description: "Previously evaluated recipe whose dataset.ids.json should be unioned into the current output."
